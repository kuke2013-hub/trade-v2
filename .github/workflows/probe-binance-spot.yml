name: Probe Binance Spot connectivity (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-binance-spot.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate hourly and minute market candles plus book ask on Binance's public market-data host
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://data-api.binance.vision/api/v3/';
          const probes = [
            {name:'90 completed-or-forming hourly candles',path:'klines?symbol=BTCUSDT&interval=1h&limit=90',
              valid:x=>Array.isArray(x)&&x.length===90&&x.every(row=>Array.isArray(row)&&row.length>=7)},
            {name:'10 one-minute candles',path:'klines?symbol=BTCUSDT&interval=1m&limit=10',
              valid:x=>Array.isArray(x)&&x.length===10&&x.every(row=>Array.isArray(row)&&row.length>=7)},
            {name:'best bid and ask',path:'ticker/bookTicker?symbol=ETHUSDT',
              valid:x=>+x?.askPrice>0&&+x?.bidPrice>0&&+x.askPrice>=+x.bidPrice}
          ];
          let failed=0;
          for (const p of probes){
            try{
              const r=await fetch(base+p.path,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(15000)});
              const data=r.ok?await r.json():null;
              const valid=r.ok&&p.valid(data);
              console.log(JSON.stringify({probe:p.name,httpStatus:r.status,valid}));
              if(!valid)failed++;
            }catch(e){
              console.log(JSON.stringify({probe:p.name,error:String(e.message)}));
              failed++;
            }
          }
          if(failed)process.exitCode=1;
          NODE
