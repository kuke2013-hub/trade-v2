name: Probe Binance Spot connectivity (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-binance-spot.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test official Binance public hourly candles without trading
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const hosts = [
            'https://api-gcp.binance.com',
            'https://data-api.binance.vision',
            'https://api.binance.com'
          ];
          const path = '/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=90';
          let success = 0;
          for (const host of hosts) {
            try {
              const res = await fetch(host + path, {
                signal: AbortSignal.timeout(12000),
                headers: { 'Accept': 'application/json' }
              });
              let valid = false;
              let details = '';
              if (res.ok) {
                const body = await res.json();
                valid = Array.isArray(body) && body.length === 90 &&
                  body.every(row => Array.isArray(row) && row.length >= 7);
                if (valid) success++;
              } else {
                details = (await res.text()).replace(/[\r\n]+/g, ' ').slice(0, 180);
              }
              console.log(JSON.stringify({ host: new URL(host).hostname, status: res.status, valid, details }));
            } catch (e) {
              console.log(JSON.stringify({ host: new URL(host).hostname, error: String(e.message).slice(0, 140) }));
            }
          }
          console.log('Accessible official Spot endpoints: ' + success + '/' + hosts.length);
          if (success === 0) process.exitCode = 1;
          NODE
