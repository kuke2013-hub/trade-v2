name: Validate V2 scanner and historical research
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine.test.mjs tests/trade-chart.test.mjs tests/ml.test.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Validate the browser and actual user interactions
        run: node tests/browser.test.mjs
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/requirements.txt
      - name: Verify historical parser, labels and purged chronological splits
        run: python -m unittest discover -s tests -p 'test_*.py' -v