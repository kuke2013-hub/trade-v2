name: V2 unattended Binance paper collector (five-minute pilot)
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trade-v2-paper-collector
  cancel-in-progress: false
jobs:
  collect:
    # Explicit pilot gate: scheduled job is skipped until the user enables the variable.
    if: github.event_name == 'workflow_dispatch' || vars.TRADE_V2_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate actual Binance Spot data and persist simulated state to D1
        env:
          TRADE_V2_INGEST_TOKEN: ${{ secrets.TRADE_V2_INGEST_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node cloud/collector.mjs